services:

  mysql:
    image: mysql:8.4
    container_name: easy-order-db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - easy_order_mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s


  backend:
    build:
      context: ../easy-order-backend

    container_name: easy-order-backend
    restart: unless-stopped

    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

    ports:
      - "8080:8080"

    depends_on:
      mysql:
        condition: service_healthy


  frontend:
    build:
      context: ../easy-order-frontend

    container_name: easy-order-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend


volumes:
  easy_order_mysql_data: